name: reforest-ai

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: reforest-postgres
    environment:
      POSTGRES_DB: reforest
      POSTGRES_USER: reforest
      POSTGRES_PASSWORD: reforest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforest -d reforest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reforest-backend
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RUST_LOG: reforest_backend=info,tower_http=info
      DATABASE_URL: postgresql://reforest:reforest@postgres:5432/reforest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: reforest-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres-data:
