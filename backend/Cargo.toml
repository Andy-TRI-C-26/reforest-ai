[package]
name = "reforest-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "reforest_backend"
path = "src/lib.rs"

[[bin]]
name = "reforest-backend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
geojson = { version = "0.24", features = ["geo-types"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "request-id", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
